<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Server Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: var(--surface);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            border-right: 1px solid #334155;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        h2,
        h3 {
            margin: 0;
            color: #60a5fa;
        }

        .server-btn {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid transparent;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .server-btn:hover {
            background-color: var(--surface-hover);
            color: white;
        }

        .server-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-top: 0.75rem;
            padding: 0 0.25rem;
        }

        .search-bar {
            display: flex;
            gap: 0.75rem;
            background: var(--surface);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--bg);
            color: white;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .button:hover {
            background-color: #2563eb;
        }

        .status-msg {
            font-size: 0.9rem;
            min-height: 1.2em;
        }

        /* Player Section */
        .player-wrapper {
            display: none;
            flex-direction: column;
            gap: 1.25rem;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        /* Provider Grid */
        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
        }

        .stream-card {
            background: var(--bg);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .stream-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .stream-card.active-stream {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
        }

        .provider-name {
            font-weight: 600;
            color: white;
            font-size: 0.95rem;
        }

        .stream-badge {
            font-size: 0.7rem;
            background: #10b981;
            color: white;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            align-self: flex-start;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Debug */
        .debug-data {
            background: #0b1120;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.82rem;
            color: #94a3b8;
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }
        
        :root {
          --plyr-color-main: #3b82f6;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Stream Hub</h2>
        <p style="font-size:0.78rem;color:#64748b;margin-top:-2px;">Select an API to test</p>

        <button class="server-btn active" style="background:#6366f1;" onclick="selectServer(this,'master-aggregate',0,'master-aggregate')">🚀 Master Aggregate (All APIs)</button>`n        <button class="server-btn" onclick="selectServer(this,'streamtv-all',5000,'streamtv-all')">🌐 StreamTV Aggregate</button>

        <div class="section-label">StreamTV Providers (Port 5000)</div>
        <button class="server-btn" onclick="selectServer(this,'vixsrc',5000,'provider')">Vixsrc</button>

        <div class="section-label">TMDB Embed Providers (Port 3000)</div>
        <button class="server-btn" onclick="selectServer(this,'streamflix',3000,'tmdb')">Streamflix</button>
        <button class="server-btn" onclick="selectServer(this,'vidlink',3000,'tmdb')">Vidlink</button>
        <button class="server-btn" onclick="selectServer(this,'vixsrc',3000,'tmdb')">Vixsrc</button>

        <div class="section-label">Anime APIs</div>
        <button class="server-btn" onclick="selectServer(this,'anivexa',4000,'anime')">Anivexa</button>
        <button class="server-btn" onclick="selectServer(this,'aniwatch',4001,'anime')">Aniwatch</button>
        <button class="server-btn" onclick="selectServer(this,'hianime',4002,'anime')">HiAnime</button>
    </div>

    <div class="main-content">
        <div class="search-bar">
            <input type="text" id="query-input" placeholder="Movie name or id:1101383 …" value="id:1101383">
            <button class="button" onclick="searchAndFetch()">Search Streams</button>
        </div>
        <div id="status-text" class="status-msg"></div>

        <!-- Player -->
        <div class="player-wrapper" id="player-wrapper">
            <div style="display:flex; justify-content:flex-end;">
                <select id="audio-track-selector" style="display:none; padding: 0.4rem 0.8rem; border-radius: 6px; background: #334155; color: white; border: 1px solid #475569; outline: none; cursor: pointer; font-size:0.85rem;"></select>
            </div>
            <div id="player-container">
                <!-- Plyr video element goes here -->
            </div>

            <div>
                <h3 style="margin-bottom:0.6rem;">Available Servers</h3>
                <div class="streams-grid" id="streams-grid"></div>
            </div>
        </div>

        <!-- Raw data -->
        <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;">
                <h3 style="color:#475569;font-size:0.85rem;">Raw Response Data</h3>
                <button onclick="document.getElementById('debug-data').style.display='block'"
                    style="background:none;border:1px solid #334155;color:#94a3b8;border-radius:4px;cursor:pointer;padding:2px 8px;font-size:0.8rem;">Show</button>
            </div>
            <div id="debug-data" class="debug-data"></div>
        </div>
    </div>

    <script>
        let currentPort = 5000;
        let currentServerType = 'streamtv-all';
        let providerId = 'streamtv-all';
        let playerInstance = null;
        let hlsInstance = null;

        const TMDB_API_KEY = '4df72f7035ab2ad32095819d458c2d53';

        function selectServer(btn, id, port, type) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPort = port;
            providerId = id;
            currentServerType = type;
        }

        async function searchAndFetch() {
            const query = document.getElementById('query-input').value.trim();
            const statusEl = document.getElementById('status-text');
            const debugEl = document.getElementById('debug-data');
            const wrapperEl = document.getElementById('player-wrapper');
            const gridEl = document.getElementById('streams-grid');

            if (!query) { statusEl.innerText = 'Please enter a name or ID.'; return; }

            statusEl.innerHTML = '<span style="color:#fbbf24">Loading.</span>';
            debugEl.innerText = '';
            wrapperEl.style.display = 'none';
            gridEl.innerHTML = '';

            try {
                let targetEndpoint = '';
                let mediaType = 'movie', tmdbId = query;
                let data = {};

                if (currentServerType === 'anime') {
                    targetEndpoint = `/anime/search?q=${encodeURIComponent(query)}`;
                } else {
                    if (query.toLowerCase().startsWith('id:')) {
                        tmdbId = query.split(':')[1].trim();
                        statusEl.innerHTML = `<span style="color:#fbbf24">Fetching streams for TMDB ID: ${tmdbId}.</span>`;
                    } else {
                        statusEl.innerHTML = `<span style="color:#fbbf24">Searching TMDB for "${query}".</span>`;
                        const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                        if (!r.ok) throw new Error('TMDB search failed (API key may be invalid). Use id:550 format.');
                        const d = await r.json();
                        if (!d.results?.length) { statusEl.innerText = `Nothing found for "${query}". Try id:YOUR_ID`; return; }
                        const best = d.results[0];
                        mediaType = best.media_type === 'tv' ? 'tv' : 'movie';
                        tmdbId = best.id;
                        statusEl.innerHTML = `<span style="color:#fbbf24">Found "${best.title || best.name}". Fetching.</span>`;
                    }
                    
                    let allStreams = [];
                    if (currentServerType === 'master-aggregate') {
                        statusEl.innerHTML = '<span style="color:#fbbf24">Aggregating from ALL backend servers...</span>';
                        const p1 = fetch(`http://localhost:5000/api/direct-aggregate?id=${tmdbId}&type=${mediaType}&season=1&episode=1`).then(r => r.ok ? r.json() : {}).catch(e => ({}));
                        const p2 = fetch(`http://localhost:8787/api/streams/${mediaType === 'tv' ? 'series' : 'movie'}/${tmdbId}?season=1&episode=1`).then(r => r.ok ? r.json() : {}).catch(e => ({}));
                        const p3 = fetch(`http://localhost:3000/api/streams/${mediaType === 'tv' ? 'series' : 'movie'}/${tmdbId}?season=1&episode=1`).then(r => r.ok ? r.json() : {}).catch(e => ({}));
                        
                        const [res1, res2, res3] = await Promise.all([p1, p2, p3]);
                        
                        if (res1.sources) allStreams.push(...res1.sources);
                        if (res2.streams) allStreams.push(...res2.streams.map(s => ({...s, provider: s.provider || 'TMDB'})));
                        if (res3.streams) allStreams.push(...res3.streams.map(s => ({...s, provider: s.provider || 'TMDB'})));
                        
                        data = { aggregated_count: allStreams.length, sources: allStreams };
                        debugEl.innerText = JSON.stringify(data, null, 2);
                        targetEndpoint = null; // No final fetch needed
                    } else if (currentServerType === 'streamtv-all') {
                        targetEndpoint = `/api/direct-aggregate?id=${tmdbId}&type=${mediaType}&season=1&episode=1`;
                    } else if (currentServerType === 'tmdb') {
                        try {
                            const tRes = await fetch(`http://localhost:3000/api/streams/${providerId}/${mediaType === 'tv' ? 'series' : 'movie'}/${tmdbId}?season=1&episode=1`);
                            if (!tRes.ok) throw new Error('fail');
                            data = await tRes.json(); 
                            targetEndpoint = null;
                        } catch(e) {
                            targetEndpoint = `/api/streams/${providerId}/${mediaType === 'tv' ? 'series' : 'movie'}/${tmdbId}?season=1&episode=1`;
                            currentPort = 8787;
                        }
                    } else if (currentServerType === 'provider') {
                        targetEndpoint = `/api/provider/${providerId}?id=${tmdbId}&type=${mediaType}&season=1&episode=1`;
                    }
                }

                if (targetEndpoint) {
                    const res = await fetch(`http://localhost:${currentPort}${targetEndpoint}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status} from server`);
                    data = await res.json();
                }
                
                if (debugEl.innerText === '') debugEl.innerText = JSON.stringify(data, null, 2);

                let streamsFound = false;
                if (data && data.audioLanguages?.length) {
                    streamsFound = true;
                    data.audioLanguages.forEach((s, i) => addCard(s.provider || s.id || 'Server', s.quality || 'HD', s.url, s.subtitles || [], i === 0));
                } else if (data && data.sources?.length) {
                    streamsFound = true;
                    data.sources.forEach((s, i) => addCard(s.provider || s.name || providerId, s.quality || s.title || 'HLS', s.url, s.subtitles || s.captions || [], i === 0));
                } else if (data && data.streams?.length) {
                    streamsFound = true;
                    data.streams.forEach((s, i) => addCard(s.provider || s.name || providerId, s.quality || s.title || 'HLS', s.url, s.subtitles || s.captions || [], i === 0));
                }

                if (streamsFound) {
                    statusEl.innerHTML = '<span style="color:#10b981">✅ Streams found! Select a server below.</span>';
                    wrapperEl.style.display = 'flex';
                } else {
                    statusEl.innerText = 'No streams found. Check Raw Data.';
                    debugEl.style.display = 'block';
                }
            } catch (e) {
                statusEl.innerHTML = `<span style="color:#ef4444">❌ ${e.message}</span>`;
            }
        }

        function addCard(name, badge, url, subtitles, autoPlay) {
            const grid = document.getElementById('streams-grid');
            const card = document.createElement('div');
            card.className = 'stream-card' + (autoPlay ? ' active-stream' : '');
            card.innerHTML = `
            <div class="stream-badge">${badge}</div>
            <div class="provider-name">${name}</div>
            ${subtitles.length ? `<div style="color:#60a5fa;font-size:0.75rem;">💬 ${subtitles.length} subtitle(s)</div>` : ''}
        `;
            card.onclick = () => {
                document.querySelectorAll('.stream-card').forEach(c => c.classList.remove('active-stream'));
                card.classList.add('active-stream');
                loadPlayer(url, subtitles);
            };
            grid.appendChild(card);
            if (autoPlay) loadPlayer(url, subtitles);
        }

        function loadPlayer(url, subtitles) {
            subtitles = subtitles || [];
            
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (playerInstance) { playerInstance.destroy(); playerInstance = null; }
            
            const container = document.getElementById('player-container');
            container.innerHTML = '<video id="plyr-video" controls crossorigin playsinline style="width: 100%; height: 100%;"></video>';
            const video = document.getElementById('plyr-video');

            // Add subtitles
            subtitles.forEach((s, i) => {
                const track = document.createElement('track');
                track.kind = 'captions';
                track.label = s.label || s.language || `Sub ${i + 1}`;
                track.srclang = s.language ? s.language.substring(0, 2) : 'en';
                track.src = `http://localhost:5000/api/stream/proxy.m3u8?url=${encodeURIComponent(s.url)}`;
                video.appendChild(track);
            });

            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls({ maxBufferLength: 40 });
                hlsInstance = hls;
                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    const audioTracks = hls.audioTracks;
                    const audioSelect = document.getElementById('audio-track-selector');
                    if (audioTracks && audioTracks.length > 1) {
                        audioSelect.style.display = 'block';
                        audioSelect.innerHTML = audioTracks.map((t, i) => `<option value="${i}" ${i === hls.audioTrack ? 'selected' : ''}>🎙️ ${t.name || t.lang || 'Track '+(i+1)}</option>`).join('');
                        audioSelect.onchange = (e) => { hls.audioTrack = parseInt(e.target.value); };
                    } else {
                        audioSelect.style.display = 'none';
                        audioSelect.innerHTML = '';
                    }
                    const availableQualities = hls.levels.map((l) => l.height).filter(h => h);
                    
                    const options = {
                        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                        captions: { active: true, update: true, language: 'en' },
                    };

                    if (availableQualities.length > 0) {
                        options.quality = {
                            default: availableQualities[0],
                            options: availableQualities,
                            forced: true,
                            onChange: (e) => {
                                hlsInstance.levels.forEach((level, levelIndex) => {
                                    if (level.height === e) {
                                        hlsInstance.currentLevel = levelIndex;
                                    }
                                });
                            },
                        };
                    }
                    
                    playerInstance = new Plyr(video, options);
                    video.play().catch(()=>{});
                });
            } else {
                video.src = url;
                playerInstance = new Plyr(video, {
                     controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                     captions: { active: true, update: true, language: 'en' }
                });
                video.play().catch(()=>{});
            }
        }
    </script>
</body>

</html>
